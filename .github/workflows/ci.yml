name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run audit:repo
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: AgentScope-win-unpacked
          path: apps/desktop/out/
